spring:
  application:
    name: spring-boot-kryo-lettuce
  threads:
    virtual:
      enabled: true

# Direct Lettuce Redis connection (no Spring Data Redis)
redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  timeout: 3s

# Kryo serialization pool configuration
kryo:
  pool-size: 64
  output-buffer-size: 16384
  schema-version: 1

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example.kryo: DEBUG
    io.lettuce.core: INFO
