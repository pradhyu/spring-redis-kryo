spring:
  application:
    name: spring-boot-kryo-lettuce
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example.kryo: DEBUG
    io.lettuce.core: INFO
